[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipops-backend"
version = "0.1.0"
description = "ClipOps API"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "sqlalchemy",
  "uvicorn",
]

[dependency-groups]
dev = ["httpx", "pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/clipops"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
